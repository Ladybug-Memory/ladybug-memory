[project]
name = "ladybug-memory"
version = "0.1.7"
description = "Agent memory interface implemented using LadybugDB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ladybug>=0.19.1",
    "fastembed",
    "icebug>=13.0",
    "polars>=1.38.1",
    "dotenv>=0.9.9",
    "litellm>=1.81.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
kg = [
    "icebug",
    "litellm",
    "polars",
]
extract = [
    "gliner2>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lbmemory"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
